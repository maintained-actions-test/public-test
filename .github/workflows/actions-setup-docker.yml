name: actions-setup-docker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup-docker:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@rc
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker
        uses: step-security/actions-setup-docker@release
        with:
          docker_version: "24.0"
          docker_buildx: "true"

      - name: Verify Docker installation
        run: |
          docker version
          docker buildx version
