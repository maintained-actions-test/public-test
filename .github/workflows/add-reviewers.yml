name: add-reviewers

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  add-reviewers:
    name: add-reviewers
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@rc
        with:
          egress-policy: audit

      - uses: step-security/add-reviewers@release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          reviewers: anurag-stepsecurity
