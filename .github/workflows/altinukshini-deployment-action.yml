name: altinukshini-deployment-action

on:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  create-deployment:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@rc
        with:
          egress-policy: audit

      - name: Create deployment
        id: deploy
        uses: step-security/altinukshini-deployment-action@release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          environment: smoke-test-${{ github.run_id }}
          initial_status: success
          description: Smoke test from public-test

      - name: Verify deployment ID
        run: |
          if [ -z "${{ steps.deploy.outputs.deployment_id }}" ]; then
            echo "Deployment ID is empty"
            exit 1
          fi
          echo "Deployment ID: ${{ steps.deploy.outputs.deployment_id }}"
