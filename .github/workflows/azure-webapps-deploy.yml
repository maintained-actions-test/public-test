name: azure-webapps-deploy
on:
  push:
  workflow_dispatch:
    inputs: {}
permissions:
  contents: read
jobs:
  azure-webapps-deploy-main:
    name: azure-webapps-deploy (main)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Deploy to Azure Web App (@main)
        uses: step-security/azure-webapps-deploy@main
        with:
          app-name: test-app
  azure-webapps-deploy-main-v2-2-19:
    name: azure-webapps-deploy (main)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Deploy to Azure Web App (@main)
        uses: step-security/azure-webapps-deploy@v2.2.19-main
        with:
          app-name: test-app
