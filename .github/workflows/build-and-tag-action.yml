name: build-and-tag-action

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-tag-action:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@rc
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up test files
        run: |
          cp testdata/build-and-tag-action/action.yml action.yml
          cp testdata/build-and-tag-action/package.json package.json
          mkdir -p dist && echo '// test' > dist/index.js

      - name: Create test tag
        run: |
          git push origin :refs/tags/v99.0.0 2>/dev/null || true
          git tag v99.0.0
          git push origin v99.0.0

      - name: Run build-and-tag-action
        uses: step-security/build-and-tag-action@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v99.0.0
