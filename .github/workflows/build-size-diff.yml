name: build-size-diff
on:
  workflow_dispatch:
    inputs: {}
permissions:
  contents: read
  pull-requests: write
  actions: read
jobs:
  build-size-diff-main:
    name: Build Size Diff (main)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build Size Diff
        id: build_size_diff
        uses: step-security/build-size-diff@release
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          build-command: 'mkdir -p dist && cp nodetest/index.js dist/'
          allow-unsafe-build: 'true'
          skip-install: 'true'
          dist-path: dist
          comment-mode: always
      - name: List dist contents
        run: ls -lh dist/
      - name: Print status
        run: echo "Status -> ${{ steps.build_size_diff.outputs.status }} | total-gzip -> ${{ steps.build_size_diff.outputs.total-gzip }} bytes"
