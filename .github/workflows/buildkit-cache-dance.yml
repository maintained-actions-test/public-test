name: buildkit-cache-dance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  buildkit-cache-dance:
    name: buildkit-cache-dance
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@rc
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: step-security/setup-buildx-action@v4
        id: setup-buildx

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            var-cache-apt
            var-lib-apt
          key: cache-${{ hashFiles('testdata/buildkit-cache-dance/Dockerfile') }}

      - name: Inject cache into docker
        uses: step-security/buildkit-cache-dance@main
        with:
          builder: ${{ steps.setup-buildx.outputs.name }}
          cache-map: |
            {
              "var-cache-apt": {
                "target": "/var/cache/apt",
                "id": "1"
              },
              "var-lib-apt": "/var/lib/apt"
            }
          skip-extraction: false

      - name: Build
        uses: step-security/docker-build-push-action@v7
        with:
          context: testdata/buildkit-cache-dance
          push: false
          tags: buildkit-cache-dance-test:latest
