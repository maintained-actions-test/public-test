name: codspeedhq-action

on:
  workflow_dispatch:

jobs:
  run-benchmarks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      CODSPEED_SKIP_UPLOAD: true
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@rc
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run CodSpeed benchmarks
        uses: step-security/codspeedhq-action@main
        with:
          mode: walltime
          run: |
            pip install pytest pytest-codspeed -q
            cat > bench_test.py << 'PYEOF'
            def test_fibonacci(benchmark):
                def fib(n):
                    return n if n <= 1 else fib(n-1) + fib(n-2)
                benchmark(fib, 10)
            PYEOF
            pytest bench_test.py --codspeed
          allow-empty: "true"
