name: commit-comment
on:
  workflow_dispatch:
    inputs: {}
permissions:
  contents: write
jobs:
  commit-comment-main:
    name: Commit Comment (main)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Create Commit Comment
        uses: step-security/commit-comment@main
        with:
          sha: ${{ github.sha }}
          body: "Test commit comment from main workflow"
