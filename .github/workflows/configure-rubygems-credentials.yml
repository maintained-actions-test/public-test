name: configure-rubygems-credentials

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configure-rubygems-credentials:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@rc
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure RubyGems Credentials
        uses: step-security/configure-rubygems-credentials@release
        with:
          api-token: rubygems_faketoken1234567890abcdef

      - name: Verify credentials configured
        run: |
          if [ -z "$RUBYGEMS_API_KEY" ]; then echo "RUBYGEMS_API_KEY not set"; exit 1; fi
          echo "RUBYGEMS_API_KEY is set"
