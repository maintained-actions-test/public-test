name: coverallsapp-github-action

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coveralls:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@rc
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate coverage file
        run: |
          cat > coverage.lcov << 'EOF'
          TN:
          SF:src/main.js
          FN:1,main
          FNDA:1,main
          FNF:1
          FNH:1
          DA:1,1
          DA:2,1
          LF:2
          LH:2
          end_of_record
          EOF


      - name: Coveralls
        uses: step-security/coverallsapp-github-action@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage.lcov
          allow-empty: 'true'
          fail-on-error: 'false'
