name: create-tag
on:
  workflow_dispatch:
    inputs: {}
permissions:
  contents: write
jobs:
  create-tag-main:
    name: Create Tag (main)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Create Tag
        uses: step-security/create-tag@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: "v0.2.0-test"
          message: "Test tag created by workflow"
