name: gcs-cache

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  gcs-cache:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@rc
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create test cache directory
        run: mkdir -p /tmp/test-cache && echo "cached-content" > /tmp/test-cache/data.txt

      - name: Cache test directory
        uses: step-security/gcs-cache@release
        with:
          path: /tmp/test-cache
          key: gcs-cache-${{ runner.os }}-${{ github.run_id }}
