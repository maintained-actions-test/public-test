name: github-action-major-release-tagger
on:
  workflow_dispatch:
    inputs: {}
permissions:
  contents: write
jobs:
  major-release-tagger-main:
    name: Major Release Tagger (main)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Major Release Tagger
        uses: step-security/github-action-major-release-tagger@release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          log-level: "info"
          git-user-name: "actions-bot"
          git-user-email: "actions-bot@users.noreply.github.com"
          dry-run: "true"
