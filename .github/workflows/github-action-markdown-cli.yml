name: github-action-markdown-cli
on:
  workflow_dispatch:
    inputs: {}
permissions:
  contents: read
jobs:
  markdown-lint-main:
    name: Markdown Lint (main)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: markdownlint-cli
        continue-on-error: true
        uses: step-security/github-action-markdown-cli@main
        with:
          files: .
