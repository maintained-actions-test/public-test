name: github-org-member-contribution-action

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-org-member-contribution-action:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@rc
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@v7

      - name: Get Member Contributions
        uses: step-security/github-org-member-contribution-action@main
        with:
          token: ${{ secrets.ORG_TOKEN }}
          org: maintained-actions-test
