name: github-pages-deploy-action
on:
  workflow_dispatch:
    inputs: {}
permissions:
  contents: write
jobs:
  deploy-main:
    name: Deploy to GitHub Pages (main)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build site
        run: |
          mkdir -p build
          echo "<html><body><h1>Test Deploy</h1></body></html>" > build/index.html
      - name: Deploy to GitHub Pages
        uses: step-security/github-pages-deploy-action@release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages
          folder: build
          dry-run: true
