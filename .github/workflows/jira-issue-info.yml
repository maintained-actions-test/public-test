name: jira-issue-info
on:
  workflow_dispatch:
    inputs: {}
permissions:
  contents: read
jobs:
  jira-issue-info-main:
    name: Jira Issue Info (main)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Jira Login
        uses: frieder/gha-jira-login@main
        env:
          JIRA_BASE_URL: https://stepsecurity-team.atlassian.net
          JIRA_USER_EMAIL: rajkumar@stepsecurity.io
          JIRA_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}
      - name: Get Jira Issue Info
        id: issue-info
        uses: step-security/jira-issue-info@main
        with:
          issue: "BTS-1"
      - name: Print Issue Info
        run: |
          echo "Issue:  ${{ steps.issue-info.outputs.issue }}"
          echo "Status: ${{ steps.issue-info.outputs.status }}"
