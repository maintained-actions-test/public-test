name: "load-secrets-action"
on:
  workflow_dispatch:
    inputs: {}
permissions:
  contents: read
jobs:
  load-secrets-main:
    name: Load Secrets (main)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Load secrets from 1Password (dry-run)
        continue-on-error: true
        uses: step-security/load-secrets-action@release
        with:
          export-env: "false"
      - name: Check 1Password CLI version
        run: op --version
