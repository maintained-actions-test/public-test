name: mimosa

on:
  workflow_dispatch:

jobs:
  mimosa-setup-action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup mimosa
        id: setup
        uses: step-security/mimosa/gh/setup-action@release
        with:
          version: latest

      - name: Verify mimosa installation
        run: |
          which mimosa
          echo "binary-path: ${{ steps.setup.outputs.binary-path }}"

  mimosa-almost-original-build-push-action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        uses: step-security/setup-qemu-action@main

      - name: Set up Docker Buildx
        uses: step-security/setup-buildx-action@main

      - name: Build with mimosa
        id: build
        uses: step-security/mimosa/gh/.almost-original-build-push-action@release
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          load: false
          tags: test/image:ci
          outputs: type=local,dest=./out

      - name: Validate local export
        run: ls -la ./out

  mimosa-build-push-action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        uses: step-security/setup-qemu-action@main

      - name: Set up Docker Buildx
        uses: step-security/setup-buildx-action@main

      - name: Build and push with mimosa
        id: build
        uses: step-security/mimosa/gh/build-push-action@release
        with:
          mimosa-setup-enabled: false
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          load: false
          tags: test/image:ci
          outputs: type=local,dest=./out

      - name: Validate local export
        run: ls -la ./out
