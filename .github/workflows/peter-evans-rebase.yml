name: peter-evans-rebase

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  rebase:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@rc
        with:
          egress-policy: audit

      - name: Rebase Pull Requests
        uses: step-security/peter-evans-rebase@release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
