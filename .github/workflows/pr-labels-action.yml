name: pr-labels-action

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  pr-labels:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@rc
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@v7

      - name: PR Labels
        uses: step-security/pr-labels-action@main
