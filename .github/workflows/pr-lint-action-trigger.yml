name: pr-lint-action-trigger

on:
  workflow_dispatch:
    inputs:
      action-tag:
        description: "Tag for the action under test (consumed by the dynamic-uses job)"
        required: true
        default: "main"

permissions:
  contents: write
  pull-requests: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@rc
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.FOR_SUBSCRIPTION_TESTS }}

      - name: Create test branch and open PR
        env:
          GH_TOKEN: ${{ secrets.FOR_SUBSCRIPTION_TESTS }}
          REF: ${{ inputs.action-tag }}
        run: |
          BRANCH="test/pr-lint-action-${{ github.run_id }}"
          git checkout -b "$BRANCH"
          mkdir -p testdata/pr-lint-action
          echo "throwaway ${{ github.run_id }}" > testdata/pr-lint-action/test-change.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add testdata/pr-lint-action/test-change.txt
          git commit -m "test: pr-lint-action"
          git push origin "$BRANCH"
          gh pr create \
            --title "Test pr-lint-action ${{ github.run_id }} (ref=$REF)" \
            --body "Automated smoke test for pr-lint-action. Will be auto-closed by the test workflow." \
            --head "$BRANCH" \
            --base main
