name: pr-lint-action

on:
  pull_request:
    branches:
      - main
    paths:
      - 'testdata/pr-lint-action/test-change.txt'

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  pr-lint-action-test:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@rc
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@v7

      - name: Run pr-lint-action
        uses: step-security/pr-lint-action@release
        with:
          title-regex: '.*'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup - close PR and delete branch
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUM: ${{ github.event.pull_request.number }}
        run: |
          gh pr close "$PR_NUM" \
            --delete-branch \
            --comment "Functional test complete for pr-lint-action."
