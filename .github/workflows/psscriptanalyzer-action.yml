name: psscriptanalyzer-action

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  psscriptanalyzer:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@rc
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@v7

      - name: Run PSScriptAnalyzer
        uses: step-security/psscriptanalyzer-action@release
        with:
          path: testdata/psscriptanalyzer-action/
          recurse: true
          output: results.sarif
