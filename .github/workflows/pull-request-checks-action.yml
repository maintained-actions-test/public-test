name: pull-request-checks-action

on:
  pull_request:

permissions:
  contents: read

jobs:
  pull-request-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@rc
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@v7

      - name: Pull Request Checks
        uses: step-security/pull-request-checks-action@main
