name: pulumi-actions

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pulumi-actions:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@rc
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Pulumi CLI
        uses: step-security/pulumi-actions@release
        with:
          pulumi-version: '^3'
          github-token: ${{ secrets.GITHUB_TOKEN }}
