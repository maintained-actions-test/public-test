name: release-comment-issues-gh-action
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to notify issues for (e.g. v1.0.0)"
        required: false
        default: "v0.0.1"
permissions:
  contents: read
  issues: write
  pull-requests: read
jobs:
  release-comment-issues-main:
    name: Release Comment Issues (main)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Comment on linked issues
        uses: step-security/release-comment-issues-gh-action@release
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          version: ${{ github.event.inputs.version }}
