name: required-approvals

on:
  pull_request:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to check approvals on"
        required: true

permissions:
  contents: read
  pull-requests: read

jobs:
  required-approvals:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@rc
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@v7

      - name: Check PR approvals
        id: approvals
        uses: step-security/required-approvals@release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          read_org_scoped_token: ${{ secrets.GITHUB_TOKEN }}
          org_name: maintained-actions-test
          min_approvals: 1
          pr_number: ${{ github.event.inputs.pr_number }}

      - name: Show result
        run: |
          echo "Approved: ${{ steps.approvals.outputs.approved }}"
          echo "Reason: ${{ steps.approvals.outputs.reason }}"
