name: rudder-transformation-action
on:
  workflow_dispatch:
    inputs: {}
permissions:
  contents: read
jobs:
  rudder-transformation-action-main:
    name: Rudder Transformation Action (main)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Run Rudder Transformation Action
        uses: step-security/rudder-transformation-action@main
        with:
          metaPath: "./testdata/rudder-transformation-action/meta.json"
          email: ${{ secrets.RUDDERSTACK_EMAIL }}
          accessToken: ${{ secrets.RUDDERSTACK_ACCESS_TOKEN }}
          uploadTestArtifact: "true"
