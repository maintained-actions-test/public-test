name: run-python-script-action

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-python-script-action:
    name: run-python-script-action
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@rc
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Run script
        id: action
        uses: step-security/run-python-script-action@main
        with:
          script: |
            print("smoke-ok")

      - name: Verify
        run: |
          test "${{ steps.action.outputs.error }}" = "false"
          grep -F "smoke-ok" <<< '${{ steps.action.outputs.stdout }}'
