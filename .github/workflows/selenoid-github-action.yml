name: selenoid-github-action

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selenoid:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@rc
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start selenoid
        uses: step-security/selenoid-github-action@release
        with:
          selenoid-start-arguments: |
            --browsers 'chrome' --last-versions 1

      - name: Verify selenoid is running
        run: |
          curl -sf http://localhost:4444/status
