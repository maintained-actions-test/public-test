name: semantic-release-action
on:
  workflow_dispatch:
    inputs: {}
permissions:
  contents: write
  issues: write
  pull-requests: write
jobs:
  semantic-release-action-main:
    name: Semantic Release Action (main)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Semantic Release
        id: semantic
        uses: step-security/semantic-release-action@release
        with:
          dry_run: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Print Release Outputs
        run: |
          echo "new_release_published: ${{ steps.semantic.outputs.new_release_published }}"
          echo "new_release_version: ${{ steps.semantic.outputs.new_release_version }}"
