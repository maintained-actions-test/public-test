name: setup-oras

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup-oras:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@rc
        with:
          egress-policy: audit

      - name: Setup ORAS
        uses: step-security/setup-oras@main
        with:
          version: 1.3.1

      - name: Verify ORAS installation
        run: oras version
