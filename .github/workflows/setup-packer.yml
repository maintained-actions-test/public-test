name: setup-packer
on:
  push:
  workflow_dispatch:
    inputs: {}
permissions:
  contents: read
jobs:
  setup-packer-main:
    name: setup-packer (main)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Packer (@main)
        uses: step-security/setup-packer@v3.0.1
      - name: Verify Packer installation
        run: packer version
