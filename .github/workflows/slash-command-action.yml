name: slash-command-action

on:
  issue_comment:
    types: [created]

permissions:
  issues: write

jobs:
  slash-command:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@rc
        with:
          egress-policy: audit

      - name: Check for Command
        id: command
        uses: step-security/slash-command-action@release
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          command: test
          reaction: "true"
          reaction-type: "eyes"
          allow-edits: "false"
          permission-level: write
