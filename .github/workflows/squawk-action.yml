name: squawk-action

on: pull_request

permissions:
  contents: read
  pull-requests: write

jobs:
  lint-migrations:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@rc
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create test SQL migration
        run: |
          mkdir -p migrations
          printf 'ALTER TABLE users ADD COLUMN age INTEGER;\n' > migrations/test-migration.sql

      - name: Lint SQL migrations
        uses: step-security/squawk-action@main
        with:
          files: migrations/test-migration.sql
          version: 'latest'
          verbose: 'true'
          upload-to-github: 'true'
          fail-on-violations: 'false'
          access_token: ${{ secrets.GITHUB_TOKEN }}
