name: studio-flow-actions

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@rc
        with:
          egress-policy: audit

      - name: Create studio config
        run: echo '{"flows":[],"replaceWidgetTypes":[]}' > /tmp/studio-config.json

      - name: Check Studio Flow
        uses: step-security/studio-flow-actions/check@release
        with:
          CONFIG_PATH: /tmp/studio-config.json

  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@rc
        with:
          egress-policy: audit

      - name: Create studio config
        run: echo '{"flows":[],"replaceWidgetTypes":[]}' > /tmp/studio-config.json

      - name: Validate Studio Flow
        uses: step-security/studio-flow-actions/validate@release
        with:
          CONFIG_PATH: /tmp/studio-config.json
          TWILIO_API_KEY: ${{ secrets.TWILIO_API_KEY }}
          TWILIO_API_SECRET: ${{ secrets.TWILIO_API_SECRET }}

  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@rc
        with:
          egress-policy: audit

      - name: Create studio config
        run: echo '{"flows":[],"replaceWidgetTypes":[]}' > /tmp/studio-config.json

      - name: Deploy Studio Flow
        uses: step-security/studio-flow-actions/deploy@release
        with:
          CONFIG_PATH: /tmp/studio-config.json
          TWILIO_API_KEY: ${{ secrets.TWILIO_API_KEY }}
          TWILIO_API_SECRET: ${{ secrets.TWILIO_API_SECRET }}

  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@rc
        with:
          egress-policy: audit

      - name: Create studio config
        run: echo '{"flows":[],"replaceWidgetTypes":[]}' > /tmp/studio-config.json

      - name: Sync Studio Flow
        uses: step-security/studio-flow-actions/sync@release
        with:
          CONFIG_PATH: /tmp/studio-config.json
          TWILIO_API_KEY: ${{ secrets.TWILIO_API_KEY }}
          TWILIO_API_SECRET: ${{ secrets.TWILIO_API_SECRET }}
