name: terraform-plan-comment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform-plan-comment:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@rc
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@v7

      - name: Create mock terraform
        run: |
          cat > /tmp/mock-terraform << 'EOF'
          #!/bin/sh
          for arg in "$@"; do
            if [ "$arg" = "-json" ]; then
              cat "$GITHUB_WORKSPACE/testdata/terraform-plan-comment/plan.json"
              exit 0
            fi
          done
          cat "$GITHUB_WORKSPACE/testdata/terraform-plan-comment/plan.txt"
          EOF
          chmod +x /tmp/mock-terraform

      - name: Terraform Plan Comment
        uses: step-security/terraform-plan-comment@release
        with:
          token: ${{ github.token }}
          planfile: testdata/terraform-plan-comment/plan.json
          terraform-cmd: /tmp/mock-terraform
          skip-comment: 'true'
