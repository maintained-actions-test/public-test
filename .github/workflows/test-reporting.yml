name: 'test-reporting'
on:
  workflow_dispatch:
    inputs: {}
jobs:
  build-test-report-main:
    name: Build & Test & Report (main)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
      - name: Install dependencies
        run: npm ci
        working-directory: report/mochawesome
      - name: Test
        run: npm test
        working-directory: report/mochawesome
        continue-on-error: true
      - name: Report
        uses: step-security/test-reporting@main
        with:
          name: Mochawesome Tests
          path: report/reports/mochawesome-json.json
          reporter: mochawesome-json
          fail-on-error: false
