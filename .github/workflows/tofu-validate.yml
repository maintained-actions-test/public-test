name: tofu-validate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tofu-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Tofu validate (@release)
        uses: step-security/tofu-validate@release
        with:
          path: testdata/tofu-validate
